# Runs on every push and pull request. Vercel deploys main on its own (its Git integration);
# make these checks required in GitHub's branch protection to block merging a red build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt pytest httpx pyflakes
      - run: pyflakes unboxd api scripts tests
      - run: pytest -q  # live TMDB tests are skipped unless run with -m live

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test  # against next start (the build above); API is mocked, so no Python or token
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
