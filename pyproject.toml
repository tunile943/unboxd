[project]
name = "unboxd"
version = "0.1.0"
description = "Personal Letterboxd recommender with two modes: Boxd In (comfort) and Boxd Out (explore)."
readme = "README.md"
requires-python = ">=3.12"
# Keep in sync with requirements.txt, which is what Vercel installs.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "fastapi>=0.115",
    "upstash-redis>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["unboxd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
